<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki - Página del Grupo</title>
    <link rel="stylesheet" th:href="@{/css/stylesgroup.css}">
</head>

<body>

<div class="container">

    <header>
        <h1>Bienvenido al Wiki del Equipo</h1>
        <p>Conoce a los miembros de nuestro equipo</p>
    </header>

    <main>

        <section class="miembros-grid">

            <div class="miembro-card" th:each="estudiante : ${estudiantes}">

                <h2 th:text="${estudiante.nombre}"></h2>

                <p th:text="${estudiante.descripcion}"></p>

                <img th:src="@{/images/{image}(image=${estudiante.imageUrl})}"
                     th:alt="${estudiante.nombre}">

                <a th:href="@{/estudiantes/{nombre}(nombre=${estudiante.nombre})}"
                   class="btn">
                    Ver Perfil
                </a>

            </div>

        </section>

        <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
            <a th:href="@{/contacto}" class="btn contacto-btn">Contáctanos</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Wiki del Equipo</p>
    </footer>

</div>

</body>
</html>
